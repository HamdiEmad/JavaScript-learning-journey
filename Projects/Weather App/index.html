<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ Weather App | Live Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form id = "weather">
        <input type="text" class="cityInput" placeholder="Enter city">
        <button type = "submit">Get Weather</button>
    </form>
    <div class = "card">
        <h1 class = "cityDisplay">Cairo</h1>
        <p class = "temp">90°F</p>
        <p class = "humidity">Humidity: 75%</p>
        <p class = "desc">Clear skies</p>
        <p class = "emoji">☀️ </p>
        <p class = "error">Please enter a city</p>
    </div>

    <script src = "index.js"></script>
</body>
</html>
